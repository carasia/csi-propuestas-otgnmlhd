<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<style>
/* client copy: no review bar; the design is chosen by the presentation */
.rv{display:none!important}
.d3 .strip{top:0!important}.d4 .cart{top:16px!important}
</style>
<title>Propuestas de diseño · CSI Industries Energy Group</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Four product-page designs built on the brief's page-6 template, in CSI's fixed brand look.
   Every design keeps: header with ES|EN + Request a quote, breadcrumb, product-lines navigation, title + description,
   type/size/standards table, quote + catalog buttons, product photo, related lines, "Can't find the size" band, footer, WhatsApp. */
:root{
  --navy:#032955; --midnight:#021B3A; --steel:#0F3D78; --orange:#EC620F; --orange-dk:#C94F07; --orange-lt:#FF9A5C;
  --mist:#F3F5F9; --fog:#E7EBF0; --line:#DCE2EA; --ink:#0E1B2C; --muted:#5B6878; --paper:#FFFFFF; --shell:#E9EDF2; --wa:#1FA855; --ok:#17804A;
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-wide:"Archivo","Public Sans",system-ui,sans-serif;
  --f-disp:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--shell);color:var(--ink);font:15px/1.6 var(--f-ui);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--midnight)}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.in{max-width:1200px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}
.mono{font:500 12px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase}

/* ---------- review bar (not part of the site) ---------- */
.rv{position:sticky;top:env(safe-area-inset-top,0px);z-index:80;background:var(--midnight);color:#fff}
.rv .in{max-width:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:8px}
.rv b{font:600 14px/1.2 var(--f-ui);margin-right:4px}
.rv nav{display:flex;flex-wrap:wrap;gap:4px}
.rv nav a{text-decoration:none;color:#C9D4E3;font-size:13px;font-weight:600;padding:6px 10px;border-radius:5px;border:1px solid #23446E}
.rv nav a span{font-family:var(--f-mono);color:var(--orange-lt);margin-right:6px}
.rv nav a[aria-current="page"]{background:var(--orange);border-color:var(--orange);color:#fff}
.rv nav a[aria-current="page"] span{color:#fff}
.rv .note{color:#8FA3BF;font-size:12.5px;flex:1 1 240px}
.rv .lang{display:flex;border:1px solid #2A4870;border-radius:5px;overflow:hidden;font:500 12px/1 var(--f-mono)}
.rv .lang button{border:0;background:none;color:#C9D4E3;padding:7px 9px;cursor:pointer}
.rv .lang button[aria-pressed="true"]{background:var(--orange);color:#fff}

/* ---------- shared site pieces ---------- */
.site{background:var(--paper);max-width:1440px;margin:0 auto;box-shadow:0 0 0 1px var(--line)}
.hd{background:var(--paper);border-bottom:1px solid var(--line)}
.hd .in{display:flex;align-items:center;gap:20px;height:70px}
.hd .logo img{height:32px;width:auto}
.hd nav{display:flex;gap:2px;margin-left:auto}
.hd nav a{text-decoration:none;font-weight:600;font-size:14px;color:var(--navy);padding:8px 10px;border-radius:5px}
.hd nav a.on{color:var(--orange-dk);box-shadow:inset 0 -2px 0 var(--orange)}
.hd .sw{font:600 13px/1 var(--f-ui);color:var(--muted);white-space:nowrap}
.hd .sw button{border:0;background:none;cursor:pointer;color:var(--muted);font-weight:600;padding:4px 2px}
.hd .sw button[aria-pressed="true"]{color:var(--navy);font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:5px;padding:12px 20px;font-weight:700;font-size:14.5px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.or{background:var(--orange);color:#fff}.btn.or:hover{background:var(--orange-dk)}
.btn.nv{background:var(--navy);color:#fff}.btn.nv:hover{background:var(--midnight)}
.btn.gh{background:transparent;color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
.btn.wh{background:#fff;color:var(--midnight)}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2}
.hd .q .s{display:none}
.hd.dark{background:var(--midnight);border-bottom-color:#13335C}
.hd.dark nav a{color:#C9D5E6}.hd.dark nav a.on{color:#fff}
.hd.dark .sw,.hd.dark .sw button{color:#7F93AE}.hd.dark .sw button[aria-pressed="true"]{color:#fff}
.crumb{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--muted)}
.crumb a{text-decoration:none}.crumb b{color:var(--navy)}
.tbl{overflow-x:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums;font-size:14px}
th{background:var(--navy);color:#fff;text-align:left;font:600 12px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:11px 14px}
td{padding:12px 14px;border-top:1px solid var(--line)}
tr:nth-child(even) td{background:#FAFBFD}
td:first-child{font-weight:700;color:var(--navy)}
.sample{font-size:12.5px;color:var(--muted);font-style:italic;margin:8px 0 0}
.tag{position:absolute;left:10px;bottom:10px;background:rgba(2,27,58,.8);color:#fff;font:500 10.5px/1 var(--f-mono);letter-spacing:.05em;padding:6px 8px;border-radius:3px}
.ask{background:var(--midnight);color:#fff}
.ask .in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 24px;padding-block:34px}
.ask h3{font:700 clamp(22px,2.4vw,30px)/1.15 var(--f-wide);letter-spacing:-.02em;margin-bottom:6px}
.ask p{margin:0;color:#C9D5E6}
.ft{background:#011429;color:#AFC0D6;font-size:13.5px}
.ft .in{display:grid;grid-template-columns:1.3fr repeat(3,minmax(0,1fr));gap:24px;padding-block:40px 22px}
.ft img{height:46px;width:auto;margin-bottom:10px}
.ft h4{margin:0 0 10px;font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#fff}
.ft ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ft .base{grid-column:1/-1;border-top:1px solid #1D3A5F;padding-top:14px;font-size:12px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
.wa{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;align-items:center;gap:8px;background:var(--wa);color:#fff;border:0;border-radius:999px;padding:12px 16px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 8px 24px rgba(2,27,58,.25)}
.wa svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.8}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--midnight);color:#fff;padding:11px 16px;border-radius:6px;font-size:14px;z-index:100;max-width:calc(100% - 32px)}

/* quote drawer (shared) */
.qd{position:fixed;inset:0;z-index:95;display:flex;justify-content:flex-end;background:rgba(2,27,58,.45)}
.qd .pn{width:min(440px,100%);height:100%;overflow:auto;background:var(--paper);padding:22px var(--gr) calc(22px + env(safe-area-inset-bottom,0px)) 22px;display:flex;flex-direction:column;gap:12px}
.qd h2{font:700 22px/1.2 var(--f-wide);color:var(--midnight)}
.qd .x{align-self:flex-end;border:1px solid var(--line);background:none;border-radius:5px;padding:6px 10px;cursor:pointer}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-weight:600;font-size:13.5px;color:var(--navy)}
.f input,.f select,.f textarea{border:1px solid #C5CEDA;border-radius:5px;padding:10px 12px;font-size:15px;width:100%;background:#fff}
.f textarea{min-height:100px;resize:vertical}
.okmsg{background:#EAF6EF;color:var(--ok);border-radius:5px;padding:10px 12px;font-weight:600;font-size:14px}

/* ========== DESIGN 1 · Catalog (the brief's template) ========== */
.d1 .crumbbar{background:var(--mist);border-bottom:1px solid var(--line)}
.d1 .crumbbar .in{padding-block:12px}
.d1 .body{display:grid;grid-template-columns:190px minmax(0,1.25fr) minmax(0,.75fr);gap:36px;padding-block:36px 44px;align-items:start}
.d1 .side h2{font:600 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--orange-dk);margin-bottom:10px}
.d1 .side ul{list-style:none;margin:0;padding:0}
.d1 .side button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 0 7px 12px;border-left:3px solid transparent;font-weight:600;color:var(--navy);cursor:pointer}
.d1 .side button[aria-current="true"]{border-left-color:var(--orange);color:var(--orange-dk)}
.d1 h1{font:800 clamp(32px,3.6vw,46px)/1.05 var(--f-wide);letter-spacing:-.03em;color:var(--midnight);margin-bottom:10px}
.d1 .lead{color:var(--muted);font-size:16.5px;margin:0}
.d1 .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.d1 table{min-width:0}
.d1 .pic{position:relative;aspect-ratio:1/1;max-width:100%;border:1px dashed #B9C5D4;border-radius:6px;background:repeating-linear-gradient(135deg,#F3F5F9 0 14px,#EDF0F5 14px 28px);display:grid;place-items:center;overflow:hidden}
.d1 .pic img{max-width:78%;max-height:78%;object-fit:contain}
.d1 .pic img.full{max-width:none;max-height:none;width:100%;height:100%;object-fit:cover}
.d1 .rel{padding-block:0 44px}
.d1 .rel h2{font:600 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--orange-dk);margin-bottom:12px}
.d1 .rel .g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.d1 .rel button{text-align:left;border:1px solid var(--line);border-top:3px solid var(--navy);background:#fff;border-radius:4px;padding:16px 18px;cursor:pointer}
.d1 .rel button b{display:block;font:700 17px/1.2 var(--f-wide);color:var(--midnight);margin-bottom:6px}
.d1 .rel button span{color:var(--orange-dk);font-weight:700;font-size:14px}

/* ========== DESIGN 2 · Datasheet ========== */
.d2{background:#F6F8FB}
.d2 .lines{background:var(--paper);border-bottom:1px solid var(--line)}
.d2 .lines .in{display:flex;gap:6px;overflow-x:auto;padding-block:10px}
.d2 .lines button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:13.5px;color:var(--navy);cursor:pointer}
.d2 .lines button[aria-current="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.d2 .top{padding-block:26px 10px}
.d2 .ttl{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-top:14px;border-bottom:2px solid var(--midnight);padding-bottom:14px}
.d2 .ttl h1{font:800 clamp(34px,4.4vw,56px)/1 var(--f-wide);letter-spacing:-.035em;color:var(--midnight)}
.d2 .ttl .code{font:500 13px/1.4 var(--f-mono);color:var(--muted);text-align:right}
.d2 .ttl .code b{color:var(--orange-dk);font-weight:500}
.d2 .grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;padding-block:22px 30px}
.d2 .plate{position:relative;background:#fff;border:1px solid var(--line);aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;overflow:hidden;background-image:linear-gradient(#E9EEF5 1px,transparent 1px),linear-gradient(90deg,#E9EEF5 1px,transparent 1px);background-size:24px 24px}
.d2 .plate img{max-width:70%;max-height:72%;object-fit:contain;filter:drop-shadow(0 14px 18px rgba(2,27,58,.18))}
.d2 .plate img.full{max-width:none;max-height:none;width:100%;height:100%;object-fit:cover;filter:none}
.d2 .plate .dim{position:absolute;left:8%;right:8%;bottom:9%;border-top:1px solid var(--orange);font:500 10.5px/1 var(--f-mono);color:var(--orange-dk);text-align:center;padding-top:5px}
.d2 .plate .dim::before,.d2 .plate .dim::after{content:"";position:absolute;top:-5px;width:1px;height:9px;background:var(--orange)}
.d2 .plate .dim::before{left:0}.d2 .plate .dim::after{right:0}
.d2 .key{background:#fff;border:1px solid var(--line);padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.d2 .key p{margin:0;color:var(--muted)}
.d2 .key dl{margin:0;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:0}
.d2 .key dt,.d2 .key dd{padding:9px 0;border-top:1px solid var(--fog);margin:0}
.d2 .key dt{font:500 11.5px/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-right:16px}
.d2 .key dd{font-weight:600;color:var(--navy)}
.d2 .key .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.d2 .tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.d2 .tabs button{flex:none;border:0;background:none;padding:12px 16px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.d2 .tabs button[aria-selected="true"]{color:var(--midnight);border-bottom-color:var(--orange)}
.d2 .tabp{padding-bottom:34px}
.d2 .docs{display:grid;gap:8px}
.d2 .docs button{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px 14px;cursor:pointer}
.d2 .docs b{color:var(--navy)}
.d2 .docs span{font:500 11.5px/1 var(--f-mono);color:var(--muted)}
.d2 .rel{padding-bottom:36px}
.d2 .rel h2,.d2 .tabh{font:600 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.d2 .rel .g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.d2 .rel button{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px 12px;cursor:pointer}
.d2 .rel img{width:54px;height:54px;object-fit:contain;flex:none}
.d2 .rel b{display:block;color:var(--navy)}
.d2 .rel span{font-size:13px;color:var(--orange-dk);font-weight:700}

/* ========== DESIGN 3 · Showcase ========== */
.d3 .hero{position:relative;background:var(--navy);color:#fff;overflow:hidden}
.d3 .hero::after{content:"";position:absolute;top:0;bottom:0;right:-8%;width:46%;background:var(--midnight);clip-path:polygon(30% 0,100% 0,100% 100%,0 100%)}
.d3 .hero::before{content:"";position:absolute;top:0;bottom:0;right:calc(37% + 4px);width:16px;background:var(--orange);transform:skewX(-14deg);z-index:1}
.d3 .hero .in{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center;padding-block:28px 40px}
.d3 .hero .crumb,.d3 .hero .crumb a{color:#9FB2CC}.d3 .hero .crumb b{color:#fff}
.d3 .hero h1{font:italic 800 clamp(54px,8vw,108px)/.88 var(--f-disp);text-transform:uppercase;letter-spacing:-.01em;margin:18px 0 14px}
.d3 .hero p{margin:0 0 22px;color:#D6DFEA;font-size:17px;max-width:44ch}
.d3 .hero .acts{display:flex;flex-wrap:wrap;gap:10px}
.d3 .hero .btn.gh{color:#fff;box-shadow:inset 0 0 0 2px #fff}
.d3 .hero .art{position:relative;min-height:300px;display:grid;place-items:center}
.d3 .hero .art img{max-height:330px;width:auto;object-fit:contain;filter:drop-shadow(0 30px 30px rgba(0,0,0,.45))}
.d3 .hero .art img.full{width:100%;height:300px;object-fit:cover;border-radius:6px;filter:none}
.d3 .hero .tag{left:auto;right:10px}
.d3 .strip{position:sticky;top:44px;z-index:30;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 6px 18px rgba(2,27,58,.06)}
.d3 .strip .in{display:flex;gap:4px;overflow-x:auto;padding-block:8px}
.d3 .strip button{flex:none;display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px 12px 6px 6px;border-radius:6px;cursor:pointer;font-weight:700;color:var(--navy)}
.d3 .strip img{width:36px;height:36px;object-fit:contain;background:var(--mist);border-radius:5px}
.d3 .strip button[aria-current="true"]{background:var(--orange);color:#fff}
.d3 .sec{padding-block:40px 10px}
.d3 .sec h2{font:italic 800 clamp(30px,3.6vw,46px)/.95 var(--f-disp);text-transform:uppercase;color:var(--midnight);margin-bottom:18px}
.d3 .types{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.d3 .card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.d3 .card figure{margin:0;aspect-ratio:4/3;max-width:100%;background:var(--mist);display:grid;place-items:center}
.d3 .card figure img{max-width:76%;max-height:76%;object-fit:contain}
.d3 .card figure img.full{max-width:none;max-height:none;width:100%;height:100%;object-fit:cover}
.d3 .card .b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.d3 .card h3{font:700 17px/1.2 var(--f-wide);color:var(--midnight)}
.d3 .card .sz{font:500 12.5px/1.4 var(--f-mono);color:var(--muted)}
.d3 .chips{display:flex;flex-wrap:wrap;gap:5px}
.d3 .chips span{background:#FFF1E7;color:var(--orange-dk);font:600 11.5px/1 var(--f-mono);padding:5px 7px;border-radius:3px}
.d3 .card .btn{margin-top:auto;padding:9px 12px;font-size:13.5px}
.d3 .facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:8px}
.d3 .facts div{background:var(--mist);padding:16px 18px}
.d3 .facts dt{font:500 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.d3 .facts dd{margin:0;font:700 16px/1.3 var(--f-wide);color:var(--midnight)}
.d3 .rel .g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding-bottom:40px}
.d3 .rel button{position:relative;display:flex;align-items:flex-end;min-height:160px;border:0;border-radius:6px;overflow:hidden;background:var(--navy);color:#fff;cursor:pointer;text-align:left;padding:16px}
.d3 .rel button img{position:absolute;right:-6%;top:6%;height:80%;width:auto;opacity:.95}
.d3 .rel button b{position:relative;font:italic 800 26px/1 var(--f-disp);text-transform:uppercase}
.d3 .ask{background:var(--orange)}
.d3 .ask p{color:#FFE7D8}

/* ========== DESIGN 4 · Quote builder (clean) ========== */
.d4 .crumbbar .in{padding-block:16px 0}
.d4 .wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:48px;padding-block:22px 56px;align-items:start}
.d4 .head{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:24px;align-items:center}
.d4 .eyebrow{font:500 12px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--orange-dk)}
.d4 h1{font:800 clamp(32px,3.6vw,46px)/1.05 var(--f-wide);letter-spacing:-.03em;color:var(--midnight);margin:10px 0 8px}
.d4 .head p{margin:0;color:var(--muted);max-width:52ch}
.d4 .catlink{display:inline-flex;align-items:center;gap:6px;margin-top:12px;border:0;background:none;padding:0;color:var(--navy);font-weight:700;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.d4 .catlink svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.d4 .thumb{position:relative;aspect-ratio:1/1;max-width:100%;background:var(--mist);border-radius:8px;overflow:hidden}
.d4 .ph{display:block;margin-top:6px;font:500 10.5px/1.3 var(--f-mono);color:var(--muted);text-align:center}
.d4 .ltabs{display:flex;gap:22px;overflow-x:auto;border-bottom:1px solid var(--line);margin:28px 0 4px}

.d4 .cart li{display:grid;grid-template-columns:minmax(0,1fr) 56px 22px;gap:8px;align-items:center;font-size:13.5px;padding:8px 0;border-bottom:1px solid #A3B1C3}

.d4 .cart li input{width:100%;border:1px solid var(--line);border-radius:5px;padding:5px 4px;text-align:center}
.d4 .cart li button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:17px;line-height:1}

/* product images: centered both ways and fitted inside their frame, whatever the image's shape */

.d2 .plate img{max-width:70%;max-height:70%}
.d3 .card figure{position:relative}
.d3 .card figure img{max-width:76%;max-height:76%}
.d4 .thumb img{max-width:80%;max-height:80%}
.d1 .pic img.full,.d2 .plate img.full,.d3 .card figure img.full,.d4 .thumb img.full{max-width:none;max-height:none;width:100%;height:100%;object-fit:cover}

.dd>button{border:0;background:none;cursor:pointer;font-weight:600;font-size:14px;color:var(--navy);padding:8px 10px;border-radius:5px}

.ddm::before{content:"";position:absolute;top:-6px;left:50%;width:10px;height:10px;background:#fff;border-left:1px solid var(--line);border-top:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}

.d1 .desc{color:#3A4A5E;font-size:15.5px;line-height:1.6;margin:0 0 22px;max-width:62ch}
.d2 .key p{color:#22303F;font-size:16.5px;line-height:1.55}
.d4 .head p{color:#22303F;font-size:16.5px;line-height:1.5;text-wrap:balance}
.d3 .hero p{color:#EEF3F9;font-size:18px;text-wrap:balance}

/* 03 Showcase strip: the homepages' 2D line icons */
.d3 .strip .ic{width:38px;height:38px;flex:none;fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;background:var(--mist);border-radius:6px;padding:4px;color:var(--navy)}
.d3 .strip button[aria-current="true"] .ic{background:rgba(255,255,255,.16);color:#fff}

/* notes show only on hover (or keyboard focus / tap) */
.tag{opacity:0;transition:opacity .15s;pointer-events:none}
.pic:hover .tag,.plate:hover .tag,.art:hover .tag,.thumb:hover .tag{opacity:1}
.sample{font-style:normal}
.note{position:relative;display:inline-flex;align-items:center;cursor:help;outline-offset:2px}
.note i{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1.5px solid #9AA8B8;color:#6B7A8C;font:italic 700 11px/1 Georgia,serif}

.note .tip{position:absolute;left:0;bottom:calc(100% + 8px);width:max-content;max-width:min(300px,80vw);background:var(--midnight);color:#fff;font:400 12.5px/1.4 var(--f-ui);padding:8px 10px;border-radius:6px;box-shadow:0 8px 20px rgba(2,27,58,.25);opacity:0;visibility:hidden;transition:opacity .15s;z-index:20}

<script>
/* CSI mockups: shared EN/ES layer. Walks the page into translation units:
   an element holding only text + plain inline tags is one unit (its innerHTML),
   otherwise each direct text node is a unit. Attributes alt/placeholder/aria-label/title too.
   Elements that already carry data-es/data-en keep their own translations. */
(function(){
var SKIP={SCRIPT:1,STYLE:1,NOSCRIPT:1,TEMPLATE:1,svg:1,SVG:1,VIDEO:1,CODE:1};
var INL={EM:1,B:1,STRONG:1,I:1,BR:1,SMALL:1,SUP:1,U:1};
var ATTRS=['alt','placeholder','aria-label','title'];
function norm(s){return s.replace(/\s+/g,' ').trim()}
function plainInline(el){
  for(var c=el.firstElementChild;c;c=c.nextElementSibling){
    if(!INL[c.tagName]||c.attributes.length)return false;
    if(c.firstElementChild&&!plainInline(c))return false;
  }
  return true;
}
function hasLetters(s){return /[A-Za-zÁÉÍÓÚáéíóúñÑ]{2,}/.test(s)}
/* visit(kind, node, key): kind 'html' (element), 'text' (text node), 'attr:<name>' (element) */
function walk(root,visit,exclude){
  (function rec(el){
    if(el.nodeType!==1||SKIP[el.tagName]||el.hasAttribute('data-noi18n'))return;
    if(exclude&&el.matches&&el.matches(exclude))return;
    for(var a=0;a<ATTRS.length;a++){var v=el.getAttribute(ATTRS[a]);if(v&&hasLetters(v)&&!el.hasAttribute('data-'+ATTRS[a]+'-es'))visit('attr:'+ATTRS[a],el,norm(v))}
    if(el.hasAttribute('data-es')||el.hasAttribute('data-es-html')){visit('own',el,null);return}
    if(el.firstElementChild&&plainInline(el)&&!el.querySelector('[data-es],[data-es-html]')){var h=norm(el.innerHTML);if(hasLetters(el.textContent))visit('html',el,h);return}
    for(var n=el.firstChild;n;n=n.nextSibling){
      if(n.nodeType===3){var t=norm(n.nodeValue);if(t&&hasLetters(t))visit('text',n,t)}
      else if(n.nodeType===1)rec(n);
    }
  })(root);
}
window.CSI_I18N_WALK=walk;
window.CSI_I18N_NORM=norm;
})();
